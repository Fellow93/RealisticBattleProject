name: Publish manual

on:
  push:
    branches: [master]
    paths:
      - "manual/**"
      - "CHANGELOG.md"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install -r manual/requirements.txt
      - run: mkdocs build --strict -f manual/mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: manual/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
